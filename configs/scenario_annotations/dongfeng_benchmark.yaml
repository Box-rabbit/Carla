description: Dongfeng benchmark scenario annotations in LMDrive/Leaderboard style.
available_scenarios:
  - Town05:
      - scenario_id: S11_basic_control_scene1_5km
        route_id: S11_basic_control_scene1_5km
        scenario_type: BasicControlScene1
        config_path: configs/scenarios/basic_control/S11_basic_control_scene1_5km.yaml
        available_event_configurations:
          - trigger:
              type: route_distance
              distance_m: 200.0
              input_mode: route
            expected:
              intents: [KEEP_LANE, ACCELERATE, RIGHT_TURN, LEFT_TURN, LANE_CHANGE_LEFT, LANE_CHANGE_RIGHT, SLOW_DOWN, PARK]
              target_progress_m: 5000
              cruise_speed_kmh: 50
              target_speed_kmh: 60
              target_speed_max_kmh_after_slowdown: 30
              voice_count: 8
              initial_quiet_distance_m: 200
              minimum_scene_spacing_m: 200
              no_collision: true
          - event_id: s11_keep_lane_01
            trigger: {type: route_distance, distance_m: 250.0, input_mode: wav}
            expected: {intents: [KEEP_LANE], target_speed_kmh: 50.0, no_collision: true}
          - event_id: s11_accelerate_02
            trigger: {type: route_distance, distance_m: 500.0, input_mode: wav}
            expected: {intents: [ACCELERATE], target_speed_kmh: 60.0, no_collision: true}
          - event_id: s11_right_turn_03
            trigger: {type: route_distance, distance_m: 750.0, input_mode: wav}
            expected: {intents: [RIGHT_TURN], target_speed_kmh: 30.0, no_collision: true}
          - event_id: s11_left_turn_04
            trigger: {type: route_distance, distance_m: 1900.0, input_mode: wav}
            expected: {intents: [LEFT_TURN], target_speed_kmh: 30.0, no_collision: true}
          - event_id: s11_lane_change_left_05
            trigger: {type: route_distance, distance_m: 2700.0, input_mode: wav}
            expected: {intents: [LANE_CHANGE_LEFT], target_speed_kmh: 45.0, no_collision: true}
          - event_id: s11_lane_change_right_06
            trigger: {type: route_distance, distance_m: 3350.0, input_mode: wav}
            expected: {intents: [LANE_CHANGE_RIGHT], target_speed_kmh: 45.0, no_collision: true}
          - event_id: s11_slow_down_07
            trigger: {type: route_distance, distance_m: 4050.0, input_mode: wav}
            expected: {intents: [SLOW_DOWN], target_speed_kmh: 30.0, no_collision: true}
          - event_id: s11_park_08
            trigger: {type: route_distance, distance_m: 4860.0, input_mode: wav}
            expected: {intents: [PARK, STOP], target_speed_kmh: 0.0, no_collision: true}
      - scenario_id: S12_complex_obstacle_scene2_8km
        route_id: S12_complex_obstacle_scene2_8km
        scenario_type: ComplexObstacleScene2
        config_path: configs/scenarios/complex_obstacle/S12_complex_obstacle_scene2_8km.yaml
        available_event_configurations:
          - trigger:
              type: route_distance
              distance_m: 0.0
              input_mode: none
            expected:
              intents: [PEDESTRIAN_CAUTION, LANE_CHANGE_LEFT, LANE_CHANGE_RIGHT, OVERTAKE, BUS_STOP_CAUTION]
              target_progress_m: 8000
              no_collision: true
          - event_id: pedestrian_crossing
            trigger:
              type: route_distance
              distance_m: 280.0
              input_mode: wav
            expected:
              intents: [PEDESTRIAN_CAUTION, SLOW_DOWN]
              target_speed_kmh: 0
              no_collision: true
          - event_id: slow_vehicle_overtake
            trigger:
              type: route_distance
              distance_m: 1090.0
              input_mode: wav
            expected:
              intents: [LANE_CHANGE_LEFT, LANE_CHANGE_RIGHT, OVERTAKE, SLOW_DOWN]
              target_speed_kmh: 50
              no_collision: true
          - event_id: bus_stop_caution
            trigger:
              type: route_distance
              distance_m: 1720.0
              input_mode: wav
            expected:
              intents: [BUS_STOP_CAUTION, PEDESTRIAN_CAUTION, SLOW_DOWN, SLOW_DOWN_30]
              target_speed_kmh: 30
              no_collision: true
      - scenario_id: S13_extreme_emergency_scene3_6km
        route_id: S13_extreme_emergency_scene3_6km
        scenario_type: EmergencyResponseScene3
        config_path: configs/scenarios/emergency_response/S13_extreme_emergency_scene3_6km.yaml
        available_event_configurations:
          - trigger:
              type: route_distance
              distance_m: 0.0
              input_mode: none
            expected:
              intents: [DANGEROUS_WEATHER, SLOW_DOWN, CUT_IN_CAUTION, EMERGENCY_BRAKE, CONSTRUCTION_MERGE_LEFT, LANE_CHANGE_RIGHT]
              target_progress_m: 5950
              no_collision: true
          - event_id: dangerous_road_safety_speed
            trigger:
              type: route_distance
              distance_m: 0.0
              input_mode: wav
            expected:
              intents: [DANGEROUS_WEATHER, SLOW_DOWN]
              target_speed_kmh: 30
              no_collision: true
          - event_id: sudden_cut_in_emergency
            trigger:
              type: route_distance
              distance_m: 1080.0
              input_mode: wav
            expected:
              intents: [CUT_IN_CAUTION, EMERGENCY_BRAKE]
              max_response_latency_ms: 120
              no_collision: true
          - event_id: construction_merge_left
            trigger:
              type: route_distance
              distance_m: 2480.0
              input_mode: wav
            expected:
              intents: [CONSTRUCTION_MERGE_LEFT, LANE_CHANGE_LEFT, LANE_CHANGE_RIGHT, SLOW_DOWN]
              target_speed_kmh: 30
              no_collision: true
