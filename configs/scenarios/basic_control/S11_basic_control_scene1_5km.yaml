scenario_id: S11_basic_control_scene1_5km
category: basic_control
version: v0.4-carla0915-global-route-s11
description: >-
  S11 基础操控场景 v0.4；CARLA 0.9.15 + Bench2Drive/Leaderboard 2.0
  设计契约。路线先由 Global Route 确定并验证完整可行，再沿路线布置任务；
  旧版 route XML、坐标和 reference trajectory 不属于本版本真源。
runtime:
  random_seed: 42
  carla_version: 0.9.15
  benchmark_stack: Bench2Drive/Leaderboard 2.0
  fixed_delta_seconds: 0.05
  max_duration_seconds: 900
  post_success_hold_seconds: 5.0
  background_vehicles: 0
map:
  town: Town05
  weather: ClearNoon
traffic_conditions:
  traffic_lights:
    mode: preserve
    agent_responsibility: obey_map_signal_phase
    scenario_layer_responsibility: preserve_and_record_infractions
ego:
  vehicle_type: vehicle.tesla.model3
  spawn_point:
    x: -20.2
    y: -94.9
    z: 0.3
    yaw: -179.9
route:
  mode: route_xml
  source_policy: validated_route_xml_from_carla0915
  route_file: routes/basic_control/S11_basic_control_scene1_5km.xml
  route_id: S11_basic_control_scene1_5km
  global_route:
    planner: GlobalRoutePlanner
    sampling_resolution_m: 2.0
    target_length_m: 5000.0
    length_tolerance_m: 250.0
    start_must_be_straight_for_m: 200.0
    spawn_offset_m: 18.0
    min_scene_spacing_m: 200.0
    align_spawn_to_route_start: true
    required_route_features:
      - straight
      - left_turn
      - right_turn
      - multi_lane_segment
      - lane_change_left
      - lane_change_right
      - final_parking_area
    route_selection:
      verify_agent_can_complete_before_scene_placement: true
      max_route_deviation_m: 4.0
      require_drivable_waypoints: true
      reject_reference_trajectory_override: true
  planner:
    anchors:
      - {x: 31.58, y: 74.52, z: 0.5}
      - {x: -272.10, y: 58.20, z: 0.5}
      - {x: -134.59, y: -140.90, z: 0.5}
      - {x: 66.78, y: -86.88, z: 0.5}
      - {x: 35.08, y: 68.35, z: 0.5}
      - {x: 189.59, y: 52.25, z: 0.5}
      - {x: -226.22, y: 64.12, z: 9.99}
      - {x: 155.08, y: -167.69, z: 0.5}
      - {x: -82.71, y: 187.60, z: 7.19}
      - {x: -70.88, y: -186.54, z: 8.36}
      - {x: 189.75, y: -10.47, z: 0.5}
    sampling_resolution_m: 2.0
    simplify_epsilon_m: 1.0
    max_segment_length_m: 25.0
controller:
  initial_target_speed_kmh: 50.0
  cruise_target_speed_kmh: 50.0
  lookahead_m: 12.0
  turn_lookahead_m: 7.0
  lane_change_lookahead_m: 10.0
  steer_gain: 1.25
  turn_steer_gain: 1.55
  lane_change_steer_gain: 1.25
  max_steer: 0.46
  turn_max_steer: 0.42
  lane_change_max_steer: 0.38
  target_point_smoothing:
    window_radius_m: 8.0
    turn_window_radius_m: 5.0
    sample_step_m: 2.0
    sigma_m: 4.0
    turn_sigma_m: 2.5
    tangent_delta_m: 2.0
  speed_target_ramp:
    accelerate_rate_kmh_per_s: 16.0
    decelerate_rate_kmh_per_s: 4.5
evaluation:
  route_corridor_half_width_m: 4.0
  red_light_lane_tolerance_m: 6.0
actors:
  vehicles: []
  pedestrians: []
  static_props: []
voice_assets:
  excluded_audio_ids:
    - record_01_20260715_204043
    - record_02_20260715_204051
    - record_03_20260715_204059
    - record_04_20260715_204105
    - record_05_20260715_204111
  required_new_recordings: 8
instructions:
  - id: s11_keep_lane_01
    trigger: {type: route_distance, value: 250.0}
    task: keep_lane
    text_zh: "保持当前车道，匀速通过前方主干道。"
    target_speed_kmh: 50.0
    expected_subtasks: [keep_lane_01]
  - id: s11_accelerate_02
    trigger: {type: route_distance, value: 500.0}
    task: accelerate
    text_zh: "前方路况开阔，请加速至60公里每小时并保持车道。"
    target_speed_kmh: 60.0
    expected_subtasks: [accelerate_60]
  - id: s11_right_turn_03
    trigger: {type: route_distance, value: 750.0}
    task: right_turn
    text_zh: "请在前方路口右转，转弯后保持当前车道。"
    target_speed_kmh: 30.0
    expected_subtasks: [complete_right_turn]
  - id: s11_left_turn_04
    trigger: {type: route_distance, value: 1300.0}
    task: left_turn
    text_zh: "请在前方路口左转，注意控制车速。"
    target_speed_kmh: 30.0
    expected_subtasks: [complete_left_turn]
  - id: s11_lane_change_left_05
    trigger: {type: route_distance, value: 2200.0}
    task: lane_change_left
    text_zh: "前方进入多车道路段，请向左变道。"
    target_speed_kmh: 45.0
    expected_subtasks: [complete_lane_change_left]
  - id: s11_lane_change_right_06
    trigger: {type: route_distance, value: 3000.0}
    task: lane_change_right
    text_zh: "请向右变道，回到右侧车道并保持车道。"
    target_speed_kmh: 45.0
    expected_subtasks: [complete_lane_change_right]
  - id: s11_slow_down_07
    trigger: {type: route_distance, value: 3800.0}
    task: slow_down
    text_zh: "前方接近终点区域，请减速至30公里每小时。"
    target_speed_kmh: 30.0
    expected_subtasks: [slow_down_30]
  - id: s11_park_08
    trigger: {type: route_distance, value: 4750.0}
    task: park
    text_zh: "请驶入终点停车区域，减速并平稳停车。"
    target_speed_kmh: 0.0
    expected_subtasks: [final_parking]
action_windows:
  route_constraints:
    min_initial_quiet_distance_m: 200.0
    min_event_spacing_m: 200.0
    min_scene_spacing_m: 200.0
  accelerate_to_60:
    enabled: true
    progress_start_m: 500.0
    progress_end_m: 700.0
    target_speed_kmh: 60.0
    control_target_speed_kmh: 60.0
    min_reached_speed_kmh: 56.0
    tolerance_kmh: 7.0
    required_hold_seconds: 0.5
  right_turn_1:
    enabled: true
    progress_start_m: 700.0
    progress_end_m: 1120.0
    direction: right
    target_speed_kmh: 25.0
    expected_heading_change_deg_min: 30.0
  left_turn_1:
    enabled: true
    progress_start_m: 1220.0
    progress_end_m: 1450.0
    direction: left
    target_speed_kmh: 30.0
    expected_heading_change_deg_min: 30.0
  lane_change_left:
    enabled: true
    progress_start_m: 2200.0
    progress_end_m: 2500.0
    target_speed_kmh: 45.0
    target_lateral_offset_m: -2.8
    completion_lateral_offset_m: 0.6
    required_hold_seconds: 1.0
  lane_change_right:
    enabled: true
    progress_start_m: 3000.0
    progress_end_m: 3300.0
    target_speed_kmh: 45.0
    target_lateral_offset_m: 0.0
    completion_lateral_offset_m: 0.6
    required_hold_seconds: 1.0
  slow_to_30:
    enabled: true
    progress_start_m: 3800.0
    progress_end_m: 4700.0
    target_speed_kmh: 30.0
    tolerance_kmh: 4.0
    required_hold_seconds: 2.0
  final_parking:
    enabled: true
    progress_start_m: 4680.0
    progress_end_m: 4960.4
    target_speed_kmh: 0.0
    stop_speed_tolerance_kmh: 3.5
    required_hold_seconds: 2.0
success_criteria:
  no_collision: true
  require_all_detected_turns: false
  route_completion_min: 0.98
  max_lane_invasion_count: 0
  max_red_light_violation_count: 0
  max_response_latency_ms: 150
  required_subtasks:
    - keep_lane_01
    - accelerate_60
    - complete_right_turn
    - complete_left_turn
    - complete_lane_change_left
    - complete_lane_change_right
    - slow_down_30
    - final_parking
  long_route:
    enabled: true
    min_length_m: 5000.0
    target_progress_m: 4900.0
failure_criteria:
  collision: true
  route_deviation: true
  lane_invasion: true
  red_light_violation: true
  blocked: true
  timeout: true
metrics:
  required:
    - route_completion
    - collision_count
    - lane_invasion_count
    - red_light_violation_count
    - target_speed_error
    - subtask_completion_rate
    - final_parking_success
