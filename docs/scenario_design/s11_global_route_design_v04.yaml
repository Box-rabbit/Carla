scenario_id: S11_basic_control_scene1_5km
version: v0.4
platform:
  carla: 0.9.15
  benchmark: Bench2Drive/Leaderboard 2.0
design_status: global_route_generation_pending_carla_validation
route_policy:
  source: GlobalRoutePlanner
  reuse_old_route_xml: false
  reuse_old_coordinates: false
  reuse_old_reference_trajectory: false
  target_length_m: 5000
  acceptable_length_range_m: [4750, 5250]
  initial_quiet_distance_m: 200
  minimum_scene_spacing_m: 200
  required_features:
    - straight
    - left_turn
    - right_turn
    - multi_lane_segment
    - lane_change_left
    - lane_change_right
    - final_parking_area
validation_order:
  - generate_global_route
  - verify_agent_completes_before_scene_placement
  - place_traffic_scenes
  - define_voice_tasks_from_real_route_features
  - tune_voice_and_scene_distribution
voice_plan:
  count: 8
  minimum_count: 7
  maximum_count: 9
  first_trigger_m: 250
  trigger_progress_m: [250, 850, 1450, 2050, 2700, 3350, 4050, 4700]
  minimum_spacing_m: 200
  tasks:
    - keep_lane
    - accelerate
    - right_turn
    - left_turn
    - lane_change_left
    - lane_change_right
    - slow_down
    - park
voice_assets:
  legacy_recordings:
    status: excluded_from_v04_matching
    reason: Existing S11 recordings contain the old concentrated layout and an 80 km/h command.
  new_recordings_required: 8
